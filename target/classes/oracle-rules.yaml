# Oracle-Specific SQL Detection Rules
# This file defines patterns and AST node types that identify Oracle-specific SQL constructs
# Rules are evaluated by OracleRuleEngine to determine what needs extraction

version: "1.0"
description: "Oracle SQL feature detection rules for MyBatis mapper extraction"

# Function-based rules: Oracle-specific functions
oracle_functions:
  - name: "NVL"
    category: "NULL_HANDLING"
    priority: 100
  - name: "NVL2"
    category: "NULL_HANDLING"
    priority: 100
  - name: "DECODE"
    category: "CONDITIONAL"
    priority: 100
  - name: "SYS_CONTEXT"
    category: "SYSTEM"
    priority: 90
  - name: "SYSDATE"
    category: "DATE_TIME"
    priority: 100
  - name: "SYSTIMESTAMP"
    category: "DATE_TIME"
    priority: 100
  - name: "ADD_MONTHS"
    category: "DATE_TIME"
    priority: 90
  - name: "MONTHS_BETWEEN"
    category: "DATE_TIME"
    priority: 90
  - name: "NEXT_DAY"
    category: "DATE_TIME"
    priority: 90
  - name: "LAST_DAY"
    category: "DATE_TIME"
    priority: 90
  - name: "LISTAGG"
    category: "AGGREGATE"
    priority: 100
  - name: "WM_CONCAT"
    category: "AGGREGATE"
    priority: 100
  - name: "XMLAGG"
    category: "XML"
    priority: 90
  - name: "XMLELEMENT"
    category: "XML"
    priority: 90
  - name: "XMLFOREST"
    category: "XML"
    priority: 90
  - name: "XMLTYPE"
    category: "XML"
    priority: 90
  - name: "JSON_OBJECT"
    category: "JSON"
    priority: 90
  - name: "JSON_TABLE"
    category: "JSON"
    priority: 90
  - name: "JSON_ARRAY"
    category: "JSON"
    priority: 90
  - name: "CONNECT_BY_ROOT"
    category: "HIERARCHICAL"
    priority: 100
  - name: "SYS_CONNECT_BY_PATH"
    category: "HIERARCHICAL"
    priority: 100

# Package function patterns (DBMS_* packages)
oracle_package_patterns:
  - pattern: "DBMS_\\w+"
    category: "PACKAGE"
    priority: 95
  - pattern: "UTL_\\w+"
    category: "PACKAGE"
    priority: 95
  - pattern: "APEX_\\w+"
    category: "PACKAGE"
    priority: 90

# Keyword-based rules: Oracle-specific SQL keywords
oracle_keywords:
  - keyword: "ROWNUM"
    category: "PSEUDO_COLUMN"
    priority: 100
  - keyword: "ROWID"
    category: "PSEUDO_COLUMN"
    priority: 100
  - keyword: "DUAL"
    category: "PSEUDO_TABLE"
    priority: 100
  - keyword: "NEXTVAL"
    category: "SEQUENCE"
    priority: 100
  - keyword: "CURRVAL"
    category: "SEQUENCE"
    priority: 100
  - keyword: "CONNECT BY"
    category: "HIERARCHICAL"
    priority: 100
  - keyword: "START WITH"
    category: "HIERARCHICAL"
    priority: 100
  - keyword: "PRIOR"
    category: "HIERARCHICAL"
    priority: 100
  - keyword: "MERGE INTO"
    category: "DML"
    priority: 100
  - keyword: "INSERT ALL"
    category: "DML"
    priority: 100
  - keyword: "FLASHBACK"
    category: "QUERY"
    priority: 90

# Hint patterns: Optimizer hints
oracle_hint_patterns:
  - pattern: "/\\*\\+\\s*\\w+"
    category: "HINT"
    priority: 85
    description: "Oracle optimizer hints like /*+ INDEX */"

# Clause-based rules: Oracle-specific clauses
oracle_clauses:
  - clause: "MODEL"
    category: "ANALYTICAL"
    priority: 90
    description: "MODEL clause for array processing"
  - clause: "MATCH_RECOGNIZE"
    category: "ANALYTICAL"
    priority: 90
    description: "Pattern matching in SQL"
  - clause: "PIVOT"
    category: "ANALYTICAL"
    priority: 85
  - clause: "UNPIVOT"
    category: "ANALYTICAL"
    priority: 85

# Data type rules: Oracle-specific types
oracle_data_types:
  - type: "VARCHAR2"
    category: "DATA_TYPE"
    priority: 80
  - type: "NUMBER"
    category: "DATA_TYPE"
    priority: 80
  - type: "CLOB"
    category: "DATA_TYPE"
    priority: 80
  - type: "BLOB"
    category: "DATA_TYPE"
    priority: 80
  - type: "NVARCHAR2"
    category: "DATA_TYPE"
    priority: 80
  - type: "NCLOB"
    category: "DATA_TYPE"
    priority: 80
  - type: "TIMESTAMP WITH LOCAL TIME ZONE"
    category: "DATA_TYPE"
    priority: 80

# Join syntax: Oracle-specific join syntax
oracle_join_syntax:
  - pattern: "\\(\\+\\)"
    category: "JOIN"
    priority: 100
    description: "Oracle outer join syntax using (+)"

# Extraction strategies
extraction_strategies:
  # For simple expressions (functions, columns)
  simple_expression:
    min_complexity: 1
    max_complexity: 10
    extract_as: "fragment"

  # For WHERE clause conditions
  where_condition:
    min_complexity: 5
    extract_as: "fragment"

  # For SELECT list items
  select_item:
    min_complexity: 3
    extract_as: "fragment"

  # For complete clauses (CONNECT BY, etc.)
  complete_clause:
    min_complexity: 1
    extract_as: "fragment"

  # For subqueries with Oracle features
  subquery:
    min_complexity: 10
    extract_as: "fragment"

# Context-aware rules: Different handling based on SQL context
context_rules:
  - context: "SELECT_LIST"
    apply_rules: ["oracle_functions", "oracle_keywords"]
    extraction_level: "expression"

  - context: "WHERE_CLAUSE"
    apply_rules: ["oracle_functions", "oracle_keywords", "oracle_join_syntax"]
    extraction_level: "condition"

  - context: "FROM_CLAUSE"
    apply_rules: ["oracle_keywords", "oracle_clauses"]
    extraction_level: "table_expression"

  - context: "ORDER_BY"
    apply_rules: ["oracle_functions", "oracle_keywords"]
    extraction_level: "expression"

  - context: "GROUP_BY"
    apply_rules: ["oracle_functions", "oracle_clauses"]
    extraction_level: "expression"

# Fragment naming conventions
fragment_naming:
  prefix: "oracle"
  separator: "_"
  include_source_file: true
  include_statement_id: true
  include_category: true
  max_length: 100